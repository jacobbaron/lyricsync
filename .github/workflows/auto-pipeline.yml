name: Perception pipeline (autonomous)

# Durable runner for the perception-ticket backlog. Every ~4h it runs Claude
# Code headless to execute ONE iteration of docs/auto_pipeline.md: pick an
# actionable [PERCEPTION] ticket, implement it, open a PR, test it in prod, and
# merge on green (or defer if nothing is unblocked).
#
# Requires a repo secret with Claude credentials — CLAUDE_CODE_OAUTH_TOKEN
# (preferred) or ANTHROPIC_API_KEY. Until that exists the job is a no-op.
# Also expects LYRICSYNC_API_KEY / LYRICSYNC_BASE_URL as secrets for the prod
# e2e step. GITHUB_TOKEN (auto-provided) needs contents + PR write.

on:
  schedule:
    - cron: "7 */4 * * *" # every 4 hours, off the :00 mark
  workflow_dispatch: # manual kick

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: perception-pipeline
  cancel-in-progress: false # never interrupt a run mid-merge

jobs:
  run-ticket:
    name: Work one perception ticket
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — credentials present
        id: guard
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ] && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "No Claude credential secret set — skipping (no-op)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.guard.outputs.ready == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run one pipeline iteration
        if: steps.guard.outputs.ready == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYRICSYNC_API_KEY: ${{ secrets.LYRICSYNC_API_KEY }}
          LYRICSYNC_BASE_URL: ${{ secrets.LYRICSYNC_BASE_URL }}
        run: |
          claude -p "Read docs/auto_pipeline.md and execute exactly ONE iteration of the runner playbook against the jacobbaron/lyricsync perception backlog (tracking issue #90, tickets #84-#89). Select one actionable, unclaimed ticket; if none is actionable, defer and stop. Implement it, open a PR, get CI green, merge to main, run the prod end-to-end acceptance test, and close the ticket on success or revert the merge on failure — all per the playbook's guardrails. Do not work more than one ticket." \
            --permission-mode acceptEdits
