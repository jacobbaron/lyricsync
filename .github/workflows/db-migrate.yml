name: DB migrate

# Applies SQL migrations to Supabase via the Supabase CLI, so schema changes
# ship through reviewed PRs + CI instead of someone running them by hand.
#
#   - On a PR: dry-run only (prints the migrations that *would* be applied) so
#     review can catch breakage without touching the database.
#   - On merge to main: `supabase db push` applies any pending migrations.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   — the project's database password
#
# No manual baseline needed: the "Baseline" step below tells the remote
# migration history that the pre-existing migrations are already applied, so the
# first `db push` doesn't try to replay them. See supabase/README.md.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-migrate.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-migrate.yml"

# Never run two migration jobs against the same DB at once.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ywfdqggvqrapwvxdzrfi

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          missing=
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required Actions secret(s):$missing — add them under Settings → Secrets and variables → Actions (repository secrets)."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      # TEMPORARY diagnostic: dump the recorded migration history (version, name
      # and statements) via the CLI's own connection, so the repo's migrations
      # can be aligned to what's really on the DB. Removed once they match.
      - name: Inspect remote migration history (diagnostic)
        continue-on-error: true
        run: |
          supabase db dump --linked --data-only --schema supabase_migrations -f /tmp/mig.sql
          echo "================ supabase_migrations dump ================"
          cat /tmp/mig.sql

      # Adopt an existing database: mark every migration that already exists in
      # production as applied so the first `db push` applies only genuinely-new
      # migrations instead of replaying history (the non-idempotent create-table
      # migrations would fail on replay). Idempotent — re-marking an already
      # applied migration is a no-op — so it's safe to leave in for every run.
      # Note: 20260620000000_add_stories_updated_at is intentionally NOT listed;
      # it is the one pre-existing migration not yet applied, so the apply step
      # below applies it.
      - name: Baseline migration history (one-time-safe)
        if: github.event_name == 'push'
        run: |
          supabase migration repair --status applied \
            20260101000000 20260102000000 20260103000000 \
            20260524000000 20260526000000 20260604000000 \
            20260607000000 20260610000000 20260610010000

      - name: Dry run (PR)
        if: github.event_name == 'pull_request'
        run: supabase db push --dry-run

      - name: Apply migrations (main)
        if: github.event_name == 'push'
        run: supabase db push
