name: DB migrate

# Applies SQL migrations to Supabase via the Supabase CLI, so schema changes
# ship through reviewed PRs + CI instead of someone running them by hand.
#
#   - On a PR: dry-run only (prints the migrations that *would* be applied) so
#     review can catch breakage without touching the database.
#   - On merge to main: `supabase db push` applies any pending migrations.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   — the project's database password
#
# No baseline needed: the repo's migration filenames already carry the same
# version numbers recorded in the remote migration history (the migrations were
# applied via the Supabase MCP over time), so `db push` sees them as applied and
# only pushes genuinely-new migrations. See supabase/README.md.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-migrate.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-migrate.yml"

# Never run two migration jobs against the same DB at once.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ywfdqggvqrapwvxdzrfi

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          missing=
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required Actions secret(s):$missing — add them under Settings → Secrets and variables → Actions (repository secrets)."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Dry run (PR)
        if: github.event_name == 'pull_request'
        run: supabase db push --dry-run

      - name: Apply migrations (main)
        if: github.event_name == 'push'
        run: supabase db push
