name: Python tests

on:
  push:
    branches: [main]
    paths:
      - "modal/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "modal/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: pytest tests/test_transcript_match.py tests/test_generate_worker.py tests/test_visual_parse.py tests/test_timeline.py tests/test_speech_cleanup.py tests/test_audio_analysis.py -v
