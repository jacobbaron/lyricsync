name: Python tests

on:
  push:
    branches: [main]
    paths:
      - "modal/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "modal/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # transcript.py is stdlib-only; the quote-matching logic needs no heavy
      # deps. (The whisperx-backed tests under lyricsync are not run here.)
      - name: Install pytest
        run: pip install pytest

      - name: Run transcript / quote-matching tests
        run: pytest tests/test_transcript_match.py -v
